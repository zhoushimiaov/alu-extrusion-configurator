name: Code review self-check (no deploy)

# 仅运行在独立修复分支，绝不调用 Wrangler 或部署相关步骤。
on:
  push:
    branches:
      - fix/code-review-selfcheck-20261018
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate import path casing
        run: node tools/check-import-case.mjs
      - name: Run unit and regression tests
        run: npm test
      - name: Validate seven-product geometry constraints
        run: node tools/qa-geometry.mjs
      - name: Build offline single-file distribution
        run: npm run build
      - name: Install Chromium for fallback smoke check
        run: npx playwright install --with-deps chromium
      - name: Test no-WebGL fallback for all products
        run: npx playwright test test/smoke.spec.mjs --grep "WebGL 不可用"
      - name: Existing browser smoke regression suite
        run: npm run smoke
