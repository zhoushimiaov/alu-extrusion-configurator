<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MODULO 模数 · 铝型材置物架配置器</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="description" content="参数化铝型材置物架实时配置器：逐层逐跨配置、算料单导出、安装说明，基于 Three.js 程序化建模" />
  <!-- 分享卡片（OG / Twitter）：微信/iMessage/Slack 抓取 -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="MODULO 模数 · 铝型材置物架配置器" />
  <meta property="og:description" content="逐层逐跨自由规划，实时算料报价，一键导出算料单与 3D 模型。" />
  <meta property="og:url" content="https://rack.means.group/" />
  <meta property="og:image" content="https://rack.means.group/og-cover.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#f5f3ef" />
</head>
<body>
  <div id="app">
    <main id="layout">
      <section id="viewport" aria-label="3D 预览">
        <canvas id="gl"></canvas>
        <svg id="dim-layer" aria-hidden="true"></svg>
        <div id="hotspot-layer"></div>
        <header class="brand-overlay">
          <div class="brand">
            <span class="brand-name">MODULO</span>
            <span class="brand-sub">铝型材置物架系统</span>
          </div>
          <div id="price-src-badge" class="price-src-badge" title=""></div>
        </header>
        <nav id="product-tabs" class="product-tabs" aria-label="产品切换">
          <button data-kind="profile" aria-label="切换到铝型材置物架">铝型材置物架</button>
          <button data-kind="rod" aria-label="切换到光轴展架">光轴展架</button>
          <button data-kind="cart" aria-label="切换到移动边几">移动边几</button>
          <button data-kind="crates" aria-label="切换到周转箱架">周转箱架</button>
          <button data-kind="woodcart" aria-label="切换到木展车">木展车</button>
          <button data-kind="hanger" aria-label="切换到挂衣架">挂衣架</button>
        </nav>
        <div id="view-tools">
          <button data-zoom="in" aria-label="放大" title="放大"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M11 8.5v5M8.5 11h5M21 21l-4.3-4.3"/></svg></button>
          <button data-zoom="out" aria-label="缩小" title="缩小"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8.5 11h5M21 21l-4.3-4.3"/></svg></button>
          <button data-fullscreen aria-label="全屏" title="全屏"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        </div>
        <div id="hud-left" class="mono"></div>
        <div id="hud-right"></div>
        <div id="loader">正在生成骨架 …</div>
        <noscript>本页面需要启用 JavaScript 才能渲染 3D 配置器。</noscript>
      </section>
      <aside id="panel" aria-label="配置面板"></aside>
    </main>
  </div>
  <div id="toast" role="status"></div>
  <script>
    // 生产错误留痕：保留最近 5 条供诊断（不做远程上报，避免无接收端的死代码）
    (function () {
      var recent = [];
      window.addEventListener('error', function (e) {
        var line = 'ERR: ' + e.message + ' @' + (e.filename || '?') + ':' + (e.lineno || 0);
        recent.push(line);
        if (recent.length > 5) recent.shift();
        window.__ALU_ERRORS = recent;
        console.error('[ALU]', line, e.error && e.error.stack || '');
      });
    })();
  </script>
  <script type="module" src="/src/main.js"></script>
  <script>
    // file:// 直接双击打开时，ES 模块会被浏览器拦截：自动跳到单文件构建产物。
    // 本守卫必须位于模块标签之后：源码页能查到该标签而触发跳转；
    // dist 内联构建后没有该标签，因此不会自跳转。
    if (location.protocol === 'file:' && document.querySelector('script[src="/src/main.js"]')) {
      location.replace('dist/index.html' + location.hash);
    }
  </script>
</body>
</html>
